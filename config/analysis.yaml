# =============================================================================
# hbf-gwas pre-registration (analysis plan and acceptance criteria)
# =============================================================================
# Declared on 2026-11-10, BEFORE any experiment was run. The phenotype is
# always simulated; 1000 Genomes has no HbF phenotype.
#
# Rules (docs/BRIEF.md):
#   * acceptance criteria are never edited after a result has been seen;
#   * if a run fails a criterion, nothing is changed: it is reported;
#   * seeds are fixed here; simulations are not tuned to hit a number.
# tests/test_config.py pins every value the brief specifies.
# Phase 2 step d adds real-data criteria under acceptance.real, and that commit
# is tagged prereg-v1 before any real association is run.
# =============================================================================

prereg:
  version: sim-v3
  declared: "2026-11-11"
  status: sim-v3 criteria amended after the FAILED sim-v2 result; sim-v3 seed pre-registered (seeds.sim_v3, commit c2ca787); predictions declared; run pending; real-data criteria pending (Phase 2 step d, which uses the sim-v3 rule)
  history:
    - "sim-v1: declared and run 2026-11-10 (config commit f63e8bd; runs/2026-11-10-sim-stratification): gate PASSED"
    - "sim-v2: power check redesigned after seeing the sim-v1 result (issue #10; D-020 to D-023); declared df3b117, run 2026-11-10 (runs/2026-11-10-sim-v2): gate FAILED, HBS1L-MYB REQUIRED at predicted power 0.809 and not recovered (p = 1.24e-6). Recorded as failed; not rerun."
    - "sim-v3: acceptance criteria amended AFTER the failed sim-v2 result (user, issue #14; D-024). The seed is pre-registered only after this amendment is merged."

# --- QC (scripts/02_qc.sh), applied one filter at a time in this order -------
qc:
  geno: 0.02
  mind: 0.02
  maf: 0.01
  hwe_p: 1.0e-6
  hwe_mode: midp
  # scripts/01_subset_afr.sh fails unless the AFR sample count after removing
  # the 1000 Genomes related-sample list lies in this range
  expected_afr_samples: {min: 640, max: 665}

# --- PCA (scripts/03_pca.sh) ------------------------------------------------
pca:
  n_pcs: 10
  method: exact # plink2 --pca 10, not --pca approx
  long_range_ld_regions: resources/long_range_ld_grch37.tsv
  maf_for_pca: 0.05 # PCA variants only; association uses the QC maf
  ld_prune: {window_kb: 1000, step: 1, r2: 0.1} # plink2 --indep-pairwise 1000kb 1 0.1
  king_cutoff: 0.0884 # plink2 --king-cutoff; second-degree relatives
  het_report: true # plink2 --het, reported only, no filter

# --- association --------------------------------------------------------------
association:
  model: additive linear regression (plink2 --glm), with and without the PCs
  genome_wide_alpha: 5.0e-8
  type1_alpha: 0.05
  # Real data: variants within this distance of a planted sentinel are not
  # treated as null when computing empirical type I error (they are in LD with it).
  null_exclusion_window_bp: 1000000

# --- Python reference vs plink2 --glm (hbfgwas.assoc.compare_to_plink2) -------
concordance:
  beta_rtol: 1.0e-3
  beta_atol: 1.0e-8
  log10p_rtol: 1.0e-3
  log10p_atol: 1.0e-2
  n_random_variants: 2000 # plus every planted sentinel

seeds:
  # sim-v1 and sim-v2 (records; the code that ran them is at f63e8bd / df3b117)
  sim_genotypes: 20261101 # sim-v1, sim-v2 genotypes
  sim_phenotype: 20261102 # sim-v1, sim-v2 genome-wide scan
  sim_power_reps: 20261103 # sim-v1 redraws
  sim_power_reps_v2: 20261104 # sim-v2 redraws
  sim_prediction: 20261105 # sim-v2 shift draws inside the prediction
  # sim-v3: ONE seed; genotypes, scan, redraws and prediction draws are spawned
  # from it (numpy SeedSequence(seed).spawn(4), in that order). Pre-registered
  # after the v3 criteria amendment is merged, pushed, then run exactly once.
  sim_v3: 20261111 # pre-registered 2026-11-11, after the sim-v3 criteria (#17) reached main (#18)
  real_phenotype: 20261201
  real_concordance_sample: 20261202

# --- sentinels on real genotypes ----------------------------------------------
# User rule (review item C, D-028), fixed before any real data: a sentinel that
# is absent from the callset (looked up by rsID and by GRCh37 position) or that
# fails QC is reported as "not testable in this callset". No proxy variant is
# chosen, before or after seeing the data. This applies to every sentinel,
# HBB cluster rs7482144 (11:5276169) included.
sentinels:
  not_testable_label: "not testable in this callset"
  proxies: none

# --- planted effects --------------------------------------------------------
# Per-allele effect of the HbF-increasing allele, in SD units of the simulated
# phenotype (total variance 1). Taken from src/hbfgwas/loci.py, where every
# value is still verified: false (issue #3).
planted_effects:
  - locus: BCL11A
    effect_allele: T
    beta_sd: 0.456435
    derivation: "sqrt(PVE / (2 p (1 - p))) with PVE 0.076 and MAF 0.24 (Wonkam et al. 2025 global meta-analysis)"
  - locus: HBS1L-MYB
    effect_allele: C
    beta_sd: 0.571
    derivation: "reported in SD units per minor allele (Lettre et al. 2008 Table 1, CSSCD)"
  - locus: HBB cluster
    effect_allele: A
    beta_sd: 0.407
    derivation: "reported in SD units per minor allele (Lettre et al. 2008 Table 1, CSSCD)"

# --- experiment 1: stratification on simulated genotypes (item 7) --------------
simulated_experiment:
  version: sim-v3
  seed_key: sim_v3 # seeds.<seed_key> drives this experiment
  # Seven equal subpopulations of ~650 people, mirroring the expected size and
  # population count of the 1000 Genomes AFR sample.
  n_per_subpop: [93, 93, 93, 93, 93, 93, 92]
  n_null_variants: 100000 # SD of lambda_GC under the null ~0.007 at this size
  fst: 0.01 # assumed Balding-Nichols differentiation; not estimated from data
  ancestral_freq_range: [0.05, 0.95] # null variants, Uniform
  # Non-genetic subpopulation shift as a fraction of phenotypic variance. Chosen
  # so the unadjusted analysis is clearly confounded (predicted lambda below);
  # it is not an estimate of any real HbF difference between populations.
  shift_var_fraction: 0.2
  n_pcs: 10
  # sim-v2 plants the per-allele effect beta_sd directly (as on real genotypes);
  # sim-v1 fixed r2 instead. r2 below is the variance explained at the
  # ancestral frequency, 2 p (1 - p) beta_sd^2: informational only.
  planted_effect_mode: beta
  power_reps: 2000 # phenotype redraws, tested at the planted variants only
  prediction_shift_draws: 2000 # shift draws averaged by hbfgwas.predict.conditional_power
  planted:
    - locus: BCL11A
      beta_sd: 0.456435
      ancestral_freq: 0.237519
      ancestral_freq_source: "1000 Genomes phase 3 AFR, T allele, via Ensembl GRCh37"
      r2: 0.075460
    - locus: HBS1L-MYB
      beta_sd: 0.571
      ancestral_freq: 0.041604
      ancestral_freq_source: "1000 Genomes phase 3 AFR, C allele, via Ensembl GRCh37"
      r2: 0.026000
    - locus: HBB cluster
      beta_sd: 0.407
      ancestral_freq: 0.1238
      ancestral_freq_source: "gnomAD exomes AFR, A allele, via Ensembl GRCh37 (no 1000 Genomes phase 3 value exists). SUSPECT: far too few homozygotes for that frequency, consistent with HBG1/HBG2 paralogy (flagged by the user, 2026-11-11)"
      r2: 0.035937
  predicted:
    # hbfgwas.simulate.expected_null_chi2 (declared in sim-v1); informational
    unadjusted_lambda_gc: 1.3688
    # sim-v1 predictions (hbfgwas.power: noncentral chi-square, partial R2 assuming
    # the PCs absorb the shift); superseded, kept for reference (docs/power.md)
    unconditional_power_pc_adjusted:
      BCL11A: 0.9973
      HBS1L-MYB: 0.2181
      HBB cluster: 0.5310
    # hbfgwas.predict.conditional_power on the realised sim-v3 genotypes after
    # adjustment for the 10 PCs (betas above, alpha 5e-8, shift averaged over
    # prediction_shift_draws draws). Declared after the sim-v3 seed and BEFORE
    # any sim-v3 phenotype is drawn. They decide which loci are REQUIRED and are
    # what the power calibration is judged against. (sim-v2 declared 0.9996 /
    # 0.8090 / 0.4621 for its own genotypes; see runs/2026-11-10-sim-v2.)
    conditional_power_pc_adjusted:
      BCL11A: 0.9958 # >= 0.99: REQUIRED in the single scan
      HBS1L-MYB: 0.0311
      HBB cluster: 0.2160

# --- real-genotype phenotype simulation (scripts/04_assoc.sh) ------------------
# Provisional: confirmed or revised in the Phase 2 step d pre-registration
# (prereg-v1), after the real n and real sentinel frequencies are known.
real_data_simulation:
  population_column: Population # the seven 1000 Genomes AFR populations
  shift_var_fraction: 0.2
  effects: planted_effects # beta_sd per HbF-increasing allele, as above

# --- acceptance criteria --------------------------------------------------------
acceptance:
  simulated:
    unadjusted_lambda_gc: {greater_than: 1.2} # structure is present
    adjusted_lambda_gc: {at_least: 0.97, at_most: 1.05}
    adjusted_type1_error: {alpha: 0.05, at_least: 0.04, at_most: 0.06}
    # sim-v3 (gated): per planted locus,
    # |empirical power over power_reps redraws - conditional predicted power| <= max_abs_diff
    power_calibration: {max_abs_diff: 0.05}
  locus_recovery:
    # sim-v3, amended after the failed sim-v2 result (D-024): a single scan is
    # one Bernoulli draw per locus, so only a locus with conditional predicted
    # power >= 0.99 is REQUIRED to reach p < association.genome_wide_alpha in
    # the single PC-adjusted scan. Every other locus is reported, not gated:
    # its single-scan hit or miss is shown next to its predicted power.
    # (sim-v1 and sim-v2 used 0.8 and the label "underpowered, not required".)
    required_if_predicted_power_at_least: 0.99
    not_required_label: "reported, not gated"
  real: null # written in Phase 2 step d, merged by the user, tagged prereg-v1

