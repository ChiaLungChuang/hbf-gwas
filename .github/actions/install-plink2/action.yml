name: Install the pinned plink2
description: >
  Official plink2 Linux build pinned in config/analysis.yaml
  (plink2.builds.linux_x86_64). The zip is checked against its sha256 on every
  use, cached or not, and the version string is checked against the config.
inputs:
  use-cache:
    description: "'true' restores the downloaded zip from the Actions cache; 'false' downloads it fresh"
    default: "true"
runs:
  using: composite
  steps:
    - name: Restore the plink2 download
      if: inputs.use-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/plink2-download
        # keyed on the pinned sha256, so a new pin never reuses an old zip
        key: plink2-16b5cf92faed7e8b8aa1010c6eab9bac17c92b57ccfa69c4d059b1b17b98eb70
    - name: Download (unless cached), verify and unpack plink2
      shell: bash
      env:
        # https://www.cog-genomics.org/plink/2.0/ "Linux 64-bit Intel", Beta 1.4 (7 Nov 2026)
        PLINK2_URL: https://s3.amazonaws.com/plink2-assets/beta1/plink2_linux_x86_64_20261107.zip
        # must equal config/analysis.yaml plink2.builds.linux_x86_64 (tests/test_config.py)
        PLINK2_SHA256: 16b5cf92faed7e8b8aa1010c6eab9bac17c92b57ccfa69c4d059b1b17b98eb70
      run: |
        command -v zstd || sudo apt-get install -y -qq zstd
        dl="$HOME/.cache/plink2-download"
        mkdir -p "$dl"
        if [ -s "$dl/plink2.zip" ]; then
          echo "plink2 zip restored from the Actions cache"
        else
          curl -fsSL -o "$dl/plink2.zip" "$PLINK2_URL"
        fi
        echo "$PLINK2_SHA256  $dl/plink2.zip" | sha256sum -c -
        unzip -o -q "$dl/plink2.zip" -d "$RUNNER_TEMP/plink2"
        echo "$RUNNER_TEMP/plink2" >> "$GITHUB_PATH"
    - name: plink2 is the build pinned in config/analysis.yaml
      shell: bash
      run: |
        plink2 --version && zstd --version && bash --version | head -1
        python -m pip install -q -c requirements/constraints.txt pyyaml
        want=$(python -c "import yaml; c=yaml.safe_load(open('config/analysis.yaml'))['plink2']; print(c['version'], '|', c['build_date'])")
        got=$(plink2 --version | head -n 1)
        echo "config: $want"; echo "plink2: $got"
        case "$got" in *"${want% |*}"*"(${want#*| })"*) echo "pinned build OK" ;; *) echo "::error::plink2 is not the pinned build"; exit 1 ;; esac
