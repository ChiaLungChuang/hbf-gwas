name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the wording check scans every commit message
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.17.4
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: shellcheck
        run: |
          shellcheck --version
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck $files; else echo "no shell scripts yet"; fi
      - name: Forbidden-wording check (files and commit messages)
        run: python scripts/check_language.py --commits

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -v

  gate:
    # Re-runs the pre-registered simulated experiment and applies the
    # acceptance gate: a statistical regression breaks the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run the pre-registered stratification experiment
        run: python scripts/run_stratification.py --out-dir "$RUNNER_TEMP/sim" --figures-dir ""
      - name: Acceptance gate
        run: python -m hbfgwas.gate --results "$RUNNER_TEMP/sim/results.json"
      - name: Reproduces the committed summary
        run: |
          python - <<'PY'
          import json, os, sys
          from hbfgwas import experiment
          ref = json.load(open("docs/figures/sim_stratification_summary.json"))
          new = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "sim", "sim_stratification_summary.json")))
          diffs = experiment.compare_summaries(ref, new)
          print("\n".join(diffs) or "summary reproduces docs/figures/sim_stratification_summary.json")
          sys.exit(1 if diffs else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-stratification
          path: ${{ runner.temp }}/sim
