name: CI

# What runs when (scripts/ci_scope.py decides; docs/ci.md explains):
# - pushes to main, manual runs, and pull requests into main that are not
#   drafts: lint, tests on Python 3.11 and 3.12, and the acceptance gate;
# - draft pull requests (stacked PRs are opened as drafts) and pull requests
#   into other branches: lint and tests on Python 3.12. A draft cannot be
#   merged; "Ready for review" starts a full run;
# - documentation-only changes: lint only (it includes the wording check).
# A newer push to the same pull request or branch cancels the run it replaces.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.scope.outputs.code }}
      full: ${{ steps.scope.outputs.full }}
      pythons: ${{ steps.scope.outputs.pythons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the wording check scans every commit message
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: What this run checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python scripts/ci_scope.py >> "$GITHUB_OUTPUT"
      - name: Install ruff
        run: python -m pip install ruff==0.17.4
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: shellcheck
        run: |
          shellcheck --version
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck $files; else echo "no shell scripts yet"; fi
      - name: Forbidden-wording check (files and commit messages)
        run: python scripts/check_language.py --commits

  test:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.lint.outputs.pythons) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install plink2 (official build, pinned) and zstd
        uses: ./.github/actions/install-plink2
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: pytest (plink2 end-to-end tests required)
        env:
          REQUIRE_PLINK2: "1"
        run: python -m pytest -v -rP

  gate:
    # Re-runs the pre-registered simulated experiment and applies the
    # acceptance gate: a statistical regression breaks the build.
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.code == 'true' && needs.lint.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Is the current criteria version's seed pre-registered?
        id: prereg
        run: |
          version=$(python -m hbfgwas.pipeline config-get simulated_experiment.version)
          key=$(python -m hbfgwas.pipeline config-get simulated_experiment.seed_key)
          seed=$(python -m hbfgwas.pipeline config-get "seeds.$key")
          if [ "$seed" = "null" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$version seed not pre-registered yet: nothing to gate. Older versions' results stay as committed records under runs/."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "gating $version (seeds.$key = $seed)"
          fi
      - name: Run the pre-registered stratification experiment
        if: steps.prereg.outputs.ready == 'true'
        run: python scripts/run_stratification.py --out-dir "$RUNNER_TEMP/sim" --figures-dir ""
      - name: Acceptance gate (current criteria version)
        if: steps.prereg.outputs.ready == 'true'
        run: python -m hbfgwas.gate --results "$RUNNER_TEMP/sim/results.json"
      - name: Reproduces the committed summary
        if: steps.prereg.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, os, sys
          from hbfgwas import experiment
          ref = json.load(open("docs/figures/sim_stratification_summary.json"))
          new = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "sim", "sim_stratification_summary.json")))
          diffs = experiment.compare_summaries(ref, new)
          print("\n".join(diffs) or "summary reproduces docs/figures/sim_stratification_summary.json")
          sys.exit(1 if diffs else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.prereg.outputs.ready == 'true'
        with:
          name: sim-stratification
          path: ${{ runner.temp }}/sim
          retention-days: 14
